<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="app-base-path" content="{{ base_path }}" />
    <title>Git Folder Dashboard</title>
    <link
      rel="icon"
      href="{{ url_for('static', filename='icons/brand.svg') }}"
      type="image/svg+xml"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css', v=version) }}"
    />
    <script
      type="module"
      src="{{ url_for('static', filename='js/app.js', v=version) }}"
    ></script>
  </head>
  <body>
    <svg
      class="icon-library"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
      </symbol>
      <symbol id="i-branch" viewBox="0 0 24 24">
        <circle cx="6" cy="5" r="2.5" />
        <circle cx="6" cy="19" r="2.5" />
        <circle cx="18" cy="5" r="2.5" />
        <path d="M6 8v8m0-3c9 0 12-1 12-5" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path
          d="M3 7V5a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"
        />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path
          d="M20 7v5h-5M4 17v-5h5m-4-4a8 8 0 0 1 13-3l2 3M4 16l2 3a8 8 0 0 0 13-3"
        />
      </symbol>
      <symbol id="i-down" viewBox="0 0 24 24">
        <path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4" />
      </symbol>
      <symbol id="i-up" viewBox="0 0 24 24">
        <path d="M12 17V4m-5 5 5-5 5 5M4 17v4h16v-4" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m16 16 5 5" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path
          d="m10.3 4-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3l-8-14a2 2 0 0 0-3.4 0Z"
        />
        <path d="M12 9v4m0 3v1" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M6 18 18 6" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m9 5 7 7-7 7" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path d="M14 3H5v18h14V8Zm0 0v6h5M8 13h8m-8 4h5" />
      </symbol>
      <symbol id="i-code" viewBox="0 0 24 24">
        <path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
        />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M21 13a9 9 0 0 1-10-10 9 9 0 1 0 10 10Z" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1" />
        <circle cx="12" cy="12" r="1" />
        <circle cx="19" cy="12" r="1" />
      </symbol>
      <symbol id="i-expand" viewBox="0 0 24 24">
        <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7" />
      </symbol>
      <symbol id="i-activity" viewBox="0 0 24 24">
        <path d="M2 12h5l3-8 4 16 3-8h5" />
      </symbol>
    </svg>
    <div class="app-shell">
      <header class="topbar">
        <button
          class="brand"
          data-action="overview"
          aria-label="Git Folder Dashboard"
        >
          <img
            src="{{ url_for('static', filename='icons/brand.svg') }}"
            width="30"
            height="30"
            alt=""
          /><span>Git Folder<span class="brand-caption">DASHBOARD</span></span>
        </button>
        <button
          id="workspaceButton"
          class="workspace-switch"
          data-action="workspace"
        >
          <span id="workspaceName"></span><span id="workspacePath"></span
          ><svg class="icon"><use href="#i-chevron" /></svg>
        </button>
        <div class="topbar-actions">
          <button
            id="refreshAll"
            class="button subtle"
            data-action="refresh-all"
          ></button>
          <button id="fetchAll" class="button" data-action="fetch-all"></button>
          <button
            id="tasksButton"
            class="icon-button task-button"
            data-action="tasks"
          ></button>
          <span class="toolbar-divider"></span>
          <button
            id="themeButton"
            class="icon-button"
            data-action="theme"
          ></button>
          <button
            id="languageButton"
            class="icon-button language-button"
            data-action="language"
          ></button>
        </div>
      </header>
      <aside class="sidebar">
        <button
          id="overviewButton"
          class="nav-overview"
          data-action="overview"
        ></button>
        <div class="sidebar-heading">
          <span id="reposLabel"></span><span id="repoCount" class="count"></span
          ><button
            id="changeWorkspace"
            class="icon-button small"
            data-action="workspace"
          ></button>
        </div>
        <label class="search-field"
          ><svg class="icon"><use href="#i-search" /></svg
          ><input id="searchInput" type="search" autocomplete="off"
        /></label>
        <div
          id="repoFilters"
          class="filter-tabs"
          aria-label="Repository filters"
        ></div>
        <nav id="repoList" class="repo-list" aria-label="Repositories"></nav>
        <div class="sidebar-bottom">
          <button
            id="foldersButton"
            class="folders-button"
            data-action="folders"
          ></button>
          <div id="syncPolicy" class="sync-policy"></div>
          <span class="version"
            >Git Folder Dashboard <span>v{{ version }}</span></span
          >
        </div>
      </aside>
      <main id="main" class="main-content">
        <div id="connectionNotice" role="status" hidden></div>
        <section id="overviewView" class="overview-view"></section>
        <section id="repositoryView" class="repository-view" hidden>
          <div id="repoHeader" class="repo-header"></div>
          <div id="repoNotice" class="repo-notice" role="status" hidden></div>
          <div id="repoToolbar" class="repo-toolbar"></div>
          <div class="repository-body">
            <div class="changes-pane">
              <div id="changesHeading" class="pane-heading"></div>
              <div id="changesList" class="changes-list"></div>
              <form id="commitForm" class="commit-panel">
                <label id="commitLabel" for="commitMessage"></label>
                <textarea
                  id="commitMessage"
                  maxlength="10000"
                  rows="3"
                ></textarea>
                <div
                  id="commitError"
                  class="commit-error"
                  role="alert"
                  hidden
                ></div>
                <div class="commit-actions">
                  <button
                    id="commitButton"
                    class="button primary"
                    type="submit"
                  ></button>
                  <details class="menu">
                    <summary id="commitMore" class="icon-button"></summary>
                    <div class="menu-popover">
                      <button
                        id="commitAllButton"
                        type="button"
                        data-action="commit-all"
                      ></button>
                    </div>
                  </details>
                </div>
                <p id="commitHint" class="commit-hint"></p>
              </form>
            </div>
            <div class="diff-pane">
              <div id="diffToolbar" class="pane-heading diff-toolbar"></div>
              <div id="diffContent" class="diff-content" tabindex="0"></div>
            </div>
          </div>
        </section>
        <section id="foldersView" class="folders-view" hidden></section>
      </main>
      <footer class="statusbar">
        <span id="statusLeft"></span
        ><button id="statusRight" data-action="tasks"></button>
        <div id="taskProgress" class="task-progress" hidden></div>
      </footer>
    </div>
    <aside
      id="taskDrawer"
      class="task-drawer"
      aria-label="Background tasks"
      hidden
    >
      <div class="drawer-heading">
        <h2 id="tasksTitle"></h2>
        <button
          id="closeTasks"
          class="icon-button"
          data-action="tasks"
        ></button>
      </div>
      <div id="taskList" class="task-list"></div>
    </aside>
    <dialog id="workspaceDialog" class="dialog workspace-dialog">
      <form id="workspaceForm">
        <div class="dialog-heading">
          <h2 id="workspaceTitle"></h2>
          <button
            class="icon-button"
            type="button"
            data-action="close-workspace"
            aria-label="Close"
          >
            <svg class="icon"><use href="#i-close" /></svg>
          </button>
        </div>
        <p id="workspaceDescription" class="muted"></p>
        <label id="pathLabel" for="pathInput"></label>
        <div class="path-field">
          <input id="pathInput" autocomplete="off" required /><button
            id="browseButton"
            class="button"
            type="button"
            data-action="browse"
          ></button>
        </div>
        <div id="workspaceError" class="inline-error" role="alert" hidden></div>
        <div class="dialog-actions">
          <button
            id="workspaceCancel"
            class="button"
            type="button"
            data-action="close-workspace"
          ></button
          ><button
            id="scanButton"
            class="button primary"
            type="submit"
          ></button>
        </div>
      </form>
    </dialog>
    <dialog id="confirmDialog" class="dialog">
      <div class="dialog-heading"><h2 id="confirmTitle"></h2></div>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button id="confirmCancel" class="button"></button
        ><button id="confirmAccept" class="button danger"></button>
      </div>
    </dialog>
    <input
      id="snapshotInput"
      type="file"
      accept=".zip,application/zip"
      hidden
    />
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
