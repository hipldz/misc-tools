[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-asr-input"
version = "0.1.0"
description = "Linux push-to-talk input using Qwen ASR"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<18"]

[project.scripts]
qwen-asr-input = "qwen_asr_input.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qwen_asr_input*"]

[tool.setuptools.package-data]
qwen_asr_input = ["assets/*.svg"]
